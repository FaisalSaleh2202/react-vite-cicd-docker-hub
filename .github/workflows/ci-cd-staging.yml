name: CI-CD - Staging

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

concurrency:
  group: ci-cd-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI - Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: ci

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Show target image
        run: |
          echo "DOCKERHUB_USERNAME=${{ vars.DOCKERHUB_USERNAME }}"
          echo "APP_NAME=${{ vars.APP_NAME }}"
          echo "IMAGE=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}:develop"
          echo "IMAGE_SHA=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}:${{ steps.meta.outputs.image_tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}:develop
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}:${{ steps.meta.outputs.image_tag }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            IMAGE="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
            CONTAINER_NAME="react-vite-app"
            PORT="8080"

            echo "Deploying new image: $IMAGE"

            OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)

            if [ -n "$OLD_IMAGE" ]; then
              echo "Current running image: $OLD_IMAGE"
            else
              echo "No existing container found. First deployment or container missing."
            fi

            docker pull "$IMAGE"

            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p ${PORT}:80 \
              "$IMAGE"

            echo "Waiting for container to be ready..."
            sleep 5

            if curl -f "http://localhost:${PORT}" > /dev/null 2>&1; then
              echo "Health check success. Deployment completed."
            else
              echo "Health check failed. Starting rollback..."

              docker logs "$CONTAINER_NAME" || true
              docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

              if [ -n "$OLD_IMAGE" ]; then
                echo "Rolling back to previous image: $OLD_IMAGE"

                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  -p ${PORT}:80 \
                  "$OLD_IMAGE"

                sleep 5

                if curl -f "http://localhost:${PORT}" > /dev/null 2>&1; then
                  echo "Rollback success."
                else
                  echo "Rollback failed too."
                  exit 1
                fi
              else
                echo "Rollback not possible because no previous image exists."
                exit 1
              fi
            fi
