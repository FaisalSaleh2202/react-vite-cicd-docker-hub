name: CI-CD - Staging

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI - Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

  build-and-push:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: ci

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Show target image
        run: |
          echo "IMAGE=ghcr.io/faisalsaleh2202/react-vite-app:develop"
          echo "IMAGE_SHA=ghcr.io/faisalsaleh2202/react-vite-app:${{ steps.meta.outputs.image_tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/faisalsaleh2202/react-vite-app:develop
            ghcr.io/faisalsaleh2202/react-vite-app:${{ steps.meta.outputs.image_tag }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Skip deploy for now
        run: echo "Step 2 fokus publish ke GHCR dulu"
