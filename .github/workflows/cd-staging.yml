name: CD - Staging

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

concurrency:
  group: cd-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Show target image
        run: |
          echo "DOCKERHUB_USERNAME=${{ vars.DOCKERHUB_USERNAME }}"
          echo "APP_NAME=${{ vars.APP_NAME }}"
          echo "IMAGE=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}:develop"
          echo "IMAGE_SHA=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}:${{ steps.meta.outputs.image_tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}:develop
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}:${{ steps.meta.outputs.image_tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            IMAGE="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
            CONTAINER_NAME="react-vite-app"

            echo "Deploying image: $IMAGE"

            docker pull "$IMAGE"

            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 8080:80 \
              "$IMAGE"

            sleep 5
            docker ps
